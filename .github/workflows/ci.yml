name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint, Test & Validate Data Pipelines (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and Format Check (Ruff)
        run: |
          ruff check Assignment2b/pipeline Assignment2b/tests flasheats/pipeline flasheats/tests
          ruff format --check Assignment2b/pipeline Assignment2b/tests flasheats/pipeline flasheats/tests

      - name: Run Test Suites with Coverage
        run: |
          pytest --cov=Assignment2b/pipeline --cov=flasheats/pipeline --cov-report=term-missing

      - name: Execute NASA C-MAPSS End-to-End Pipeline
        run: |
          python Assignment2b/pipeline/run_pipeline.py

      - name: Execute FlashEats Logistics End-to-End Pipeline
        run: |
          python flasheats/pipeline/run_pipeline.py
