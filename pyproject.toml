[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flasheats-cmapss-fde"
version = "1.0.0"
description = "Dual Forward-Deployed Engineering (FDE) Data Pipelines: NASA C-MAPSS Telemetry & FlashEats Logistics"
authors = [{ name = "NEERASA-VEDA-VARSHIT" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--import-mode=importlib -v"
testpaths = ["Assignment2b/tests", "flasheats/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [
    "inClass",
    "Assignment2b/notebooks",
    "instructor",
    ".freebuff",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # Line length handled by formatter
    "F841",  # Unused variable (common in validation/test step unpacking)
]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "Assignment2b", "flasheats"]
